<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2980b9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Eye Shape -->
  <ellipse cx="50" cy="50" rx="30" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="50" cy="50" rx="25" ry="16" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  
  <!-- Iris -->
  <circle cx="50" cy="50" r="12" fill="#34495e"/>
  
  <!-- Pupil -->
  <circle cx="50" cy="50" r="6" fill="#000000"/>
  
  <!-- Reflection -->
  <circle cx="47" cy="47" r="3" fill="white" opacity="0.6"/>
  
  <!-- Scan Lines -->
  <g stroke="#27ae60" stroke-width="1" opacity="0.8">
    <line x1="20" y1="35" x2="80" y2="35"/>
    <line x1="20" y1="45" x2="80" y2="45"/>
    <line x1="20" y1="55" x2="80" y2="55"/>
    <line x1="20" y1="65" x2="80" y2="65"/>
  </g>
  
  <!-- Corner Brackets -->
  <g stroke="#27ae60" stroke-width="2" fill="none" opacity="0.9">
    <!-- Top Left -->
    <path d="M15 25 L15 15 L25 15"/>
    <!-- Top Right -->
    <path d="M75 15 L85 15 L85 25"/>
    <!-- Bottom Left -->
    <path d="M25 85 L15 85 L15 75"/>
    <!-- Bottom Right -->
    <path d="M85 75 L85 85 L75 85"/>
  </g>
  
  <!-- Status Indicators -->
  <circle cx="75" cy="25" r="3" fill="#27ae60">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Monitoring Dots -->
  <g fill="#f39c12" opacity="0.7">
    <circle cx="30" cy="20" r="1.5">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="20" r="1.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="80" r="1.5">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="80" r="1.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- AI Network Pattern -->
  <g stroke="#3498db" stroke-width="0.5" opacity="0.4">
    <path d="M30 30 L50 50 L70 30"/>
    <path d="M30 70 L50 50 L70 70"/>
    <path d="M30 30 L30 70"/>
    <path d="M70 30 L70 70"/>
  </g>
  
  <!-- Security Shield -->
  <g transform="translate(65, 65)" opacity="0.8">
    <path d="M0 0 L4 -2 L8 0 L8 6 C8 8 4 10 4 10 C4 10 0 8 0 6 Z" 
          fill="#27ae60" stroke="white" stroke-width="0.5"/>
    <path d="M2 3 L3.5 4.5 L6 2" stroke="white" stroke-width="1" fill="none"/>
  </g>
</svg>
