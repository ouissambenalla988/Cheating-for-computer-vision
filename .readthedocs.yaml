# Read the Docs configuration file for ExamGuard Pro
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    # You can also specify other tools here
    nodejs: "18"
  jobs:
    post_create_environment:
      # Install poetry
      - pip install poetry
      # Tell poetry to not use a virtual environment
      - poetry config virtualenvs.create false
    post_install:
      # Install dependencies with poetry, or alternatively with pip
      - poetry install --only docs || pip install -r docs/requirements.txt

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: false

# Optionally build your docs in additional formats such as PDF and ePub
formats:
  - pdf
  - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - docs

# Configuration for the search functionality
search:
  ranking:
    api/v2/search/: 1
    utilisation.html: 2
    installation.html: 3
  ignore:
    - 404.html

# Redirects for URL changes
redirects:
  # Redirect old documentation URLs if any
  # "old-page.html": "new-page.html"

# Subprojects (if you have multiple documentation projects)
# subprojects:
#   include: all

# Analytics
analytics:
  google_analytics: false  # Set to your GA tracking ID if needed

# Social cards
# Automatically generate social media cards for your documentation
social_cards:
  enable: true
  image: docs/_static/logo.svg

# Advanced build configuration
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - graphviz
    - imagemagick
    - latexmk
    - tex-gyre
    - texlive-fonts-recommended
    - texlive-latex-base
    - texlive-latex-extra
    - texlive-latex-recommended
  jobs:
    pre_build:
      # Download any external assets or run preprocessing scripts
      - echo "Starting ExamGuard Pro documentation build"
    post_build:
      # Run any post-processing scripts
      - echo "ExamGuard Pro documentation build completed"

